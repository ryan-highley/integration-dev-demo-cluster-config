namespace: openshift-gitops

resources:
- ../../../applications/cert-manager/
- ../../../applications/keycloak/
- ../../../applications/streams-kafka/

patches:
- patch: |-
    - op: replace
      path: /spec/source/path
      value: apps/streams-kafka/overlays/multi-cluster-kafka
  target:
    kind: Application
    name: streams-kafka-app
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
