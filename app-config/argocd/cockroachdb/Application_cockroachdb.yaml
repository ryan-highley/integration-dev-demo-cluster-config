apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cockroachdb
spec:
  destination:
    namespace: cockroachdb
    server: https://kubernetes.default.svc
  project: cockroachdb
  source:
    path: app-config/manifests/cockroachdb
    repoURL: https://github.com/ryan-highley/integration-dev-demo-cluster-config
    # targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
