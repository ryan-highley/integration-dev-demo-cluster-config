namespace: openshift-gitops
namePrefix: camel-tahu-demo-

resources:
- ../../default/base/
- ../../../applications/messaging/

patches:
- patch: |-
    - op: replace
      path: /spec/project
      value: camel-tahu-demo-cluster-config
  target:
    group: argoproj.io
    kind: Application
    version: v1alpha1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
