namespace: openshift-gitops
namePrefix: multi-cluster-kafka-

# - ../../../applications/service-mesh/
resources:
- ../../default/base/
- ../../../applications/amq-broker/
- ../../../applications/streams-kafka/
- ../../../applications/apicurio-registry/
- ../../../applications/cert-manager/
- ../../../applications/keycloak/
# - ../../../applications/vault-secrets/

patches:
- patch: |-
    - op: replace
      path: /spec/project
      value: multi-cluster-kafka-cluster-config
  target:
    group: argoproj.io
    kind: Application
    version: v1alpha1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
