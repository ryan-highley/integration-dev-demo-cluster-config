namespace: openshift-gitops
namePrefix: debezium-

resources:
- ../../default/base/
- ../../../applications/streams-kafka/
- ../../../applications/cert-manager/

patches:
- patch: |-
    - op: replace
      path: /spec/project
      value: debezium-cluster-config
  target:
    group: argoproj.io
    kind: Application
    version: v1alpha1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
