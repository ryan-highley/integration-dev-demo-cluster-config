namespace: rtr-app-edb
namePrefix: rtr-app-

resources:
- ../../base
- OperatorGroup_cloud-native-postgresql.yaml
- ../../../../manifests/edb


  # Correct controller manager ConfigMap name to remove namePrefix

  # Set EDB namespace to be Service Mesh-enabled

  # Set the correct ServiceEntry hostnames
patches:
- options:
    allowNameChange: true
  patch: |-
    - op: replace
      path: /metadata/name
      value: postgresql-operator-controller-manager-config
  target:
    kind: ConfigMap
    name: postgresql-operator-controller-manager-config
    version: v1
- patch: |-
    - op: add
      path: /metadata/labels/service-mesh-name
      value: basic
  target:
    group: project.openshift.io
    kind: Project
    name: edb
    version: v1
- patch: |-
    - op: add
      path: /spec/hosts/0
      value: "postgresql-operator-controller-manager-service.rtr-app-edb.svc"
  target:
    group: networking.istio.io
    kind: ServiceEntry
    name: edb-cluster-operator-se
    version: v1beta1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
