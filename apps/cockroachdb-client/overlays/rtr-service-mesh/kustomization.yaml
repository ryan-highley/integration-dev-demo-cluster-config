namespace: rtr-app-cdb-client
namePrefix: rtr-app-

resources:
- ../../base


  # Set CDB Client namespace to be Service Mesh-enabled
patches:
- patch: |-
    - op: add
      path: /metadata/labels/service-mesh-name
      value: basic
  target:
    group: project.openshift.io
    kind: Project
    name: cdb-client
    version: v1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
