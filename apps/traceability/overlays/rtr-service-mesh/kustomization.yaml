namespace: rtr-tracing-system
namePrefix: rtr-

resources:
- ../../base

patches:
- patch: |-
    - op: merge
      path: /spec
      value: |-
        meshConfig:
          extensionProviders:
            - name: otel
              opentelemetry:
                port: 4317
                service: default-collector.istio-system.svc.cluster.local
  target:
    group: maistra.io
    kind: ServiceMeshControlPlane
    name: default
    version: v2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
